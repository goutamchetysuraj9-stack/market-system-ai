<script>
let tendersData = [];

window.addEventListener('DOMContentLoaded', () => {
    fetch('./tenders.json')
        .then(response => {
            if (!response.ok) throw new Error("HTTP error! Status: " + response.status);
            return response.text();
        })
        .then(textData => {
            let cleanedText = textData.trim();
            // JSON aakhiri comma fix
            if (cleanedText.endsWith(',')) cleanedText = cleanedText.slice(0, -1);
            cleanedText = cleanedText.replace(/,\s*\]\s*,?$/, ']');
            
            const data = JSON.parse(cleanedText);
            tendersData = Array.isArray(data) ? data : [];
            filterTenders(); 
        })
        .catch(err => {
            console.error("Database sync layout error:", err);
            executeFallbackUILayout();
        });
});

function filterTenders() {
    const districtFilterElement = document.getElementById("districtFilter");
    const selectedDistrict = districtFilterElement ? districtFilterElement.value : "ALL";
    const applyHeader = document.getElementById("applyGuideHeader");

    if (applyHeader) {
        applyHeader.innerText = selectedDistrict === "ALL" ? "⚙️ How to Apply (Assam State Tenders)" : `⚙️ How to Apply (${selectedDistrict} Regional Tenders)`;
    }

    const smallGrid = document.getElementById("smallGrid");
    const mediumGrid = document.getElementById("mediumGrid");
    const megaGrid = document.getElementById("megaGrid");

    if(smallGrid) smallGrid.innerHTML = "";
    if(mediumGrid) mediumGrid.innerHTML = "";
    if(megaGrid) megaGrid.innerHTML = "";

    let smallCount = 0, mediumCount = 0, megaCount = 0;

    if (!tendersData || tendersData.length === 0) {
        showNoDataFallback();
        return;
    }

    tendersData.forEach(tender => {
        if (!tender || !tender.location || !tender.budget) return;

        const locationLower = tender.location.toLowerCase();
        const filterLower = selectedDistrict.toLowerCase();
        
        if (selectedDistrict === "ALL" || locationLower.includes(filterLower)) {
            const numericBudget = parseInt(tender.budget.replace(/[^0-9]/g, ''), 10) || 0;
            const exactLink = tender.link ? tender.link : "https://assamtenders.gov.in";

            const cardHTML = `
                <div class="tender-card" style="margin-bottom:15px; padding:15px; border-radius:8px; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,0.05); display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div class="tender-title" style="font-weight:600; font-size:1.1rem; color:#2c3e50; margin-bottom:5px;">${tender.title || 'Untitled Tender'}</div>
                        <div class="tender-meta" style="font-size:0.9rem; color:#7f8c8d;">
                            <span style="margin-right:15px;"><strong>Dept:</strong> ${tender.department || 'N/A'}</span>
                            <span style="margin-right:15px;"><strong>Deadline:</strong> ${tender.deadline || 'N/A'}</span>
                            <span><strong>Win Chance:</strong> <span style="color:#27ae60; font-weight:bold;">${tender.win_probability || '0'}%</span></span>
                        </div>
                    </div>
                    <div style="text-align:right; min-width:150px;">
                        <span class="district-tag" style="background:#e8f4fd; color:#1e3c72; padding:3px 8px; border-radius:4px; font-size:0.8rem; font-weight:600; display:inline-block; margin-bottom:5px;">${tender.location}</span>
                        <div class="tender-value" style="font-size:1.2rem; font-weight:700; color:#1e3c72; margin-bottom:8px;">${tender.budget}</div>
                        <a href="${exactLink}" target="_blank" class="apply-btn" style="background:#1e3c72; color:#fff; text-decoration:none; padding:5px 12px; font-size:0.85rem; border-radius:4px; font-weight:600; display:inline-block;">View Portal →</a>
                    </div>
                </div>
            `;

            if (numericBudget <= 5000000) {
                if(smallGrid) { smallGrid.innerHTML += cardHTML; smallCount++; }
            } else if (numericBudget <= 20000000) {
                if(mediumGrid) { mediumGrid.innerHTML += cardHTML; mediumCount++; }
            } else {
                if(megaGrid) { megaGrid.innerHTML += cardHTML; megaCount++; }
            }
        }
    });

    showNoDataFallback(smallCount, mediumCount, megaCount);
}

function showNoDataFallback(smallCount = 0, mediumCount = 0, megaCount = 0) {
    const fallbackHTML = `<div class="no-data" style="padding:20px; text-align:center; color:#888; font-style:italic;">✨ No active automated contracts found for this selection.</div>`;
    const smallGrid = document.getElementById("smallGrid");
    const mediumGrid = document.getElementById("mediumGrid");
    const megaGrid = document.getElementById("megaGrid");

    if (smallCount === 0 && smallGrid) smallGrid.innerHTML = fallbackHTML;
    if (mediumCount === 0 && mediumGrid) mediumGrid.innerHTML = fallbackHTML;
    if (megaCount === 0 && megaGrid) megaGrid.innerHTML = fallbackHTML;
}

function executeFallbackUILayout() {
    const fallbackHTML = `<div class="no-data" style="padding:20px; text-align:center; color:#c0392b; font-weight:500;">⚠️ Data file sync chal raha hai, kripya thodi der me refresh karein.</div>`;
    ['smallGrid', 'mediumGrid', 'megaGrid'].forEach(id => {
        const grid = document.getElementById(id);
        if(grid) grid.innerHTML = fallbackHTML;
    });
}
</script>
