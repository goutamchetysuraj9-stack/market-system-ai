name: Automated Assam Tender Scraper Engine

on:
  schedule:
    # Runs automatically every 24 hours at 12:00 AM UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually anytime with a click

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Scraping Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Automated Scraper
      run: python scraper.py

    - name: Commit and Push Fresh Database Logs
      run: |
        git config --global user.name "GitHub Action AutoPilot"
        git config --global user.email "actions@github.com"
        git add tenders.json
        git diff-index --quiet HEAD || git commit -m "Auto-Pilot: Synced fresh Assam & Udalguri tenders database"
        git push origin main
