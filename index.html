<script>
        // DATA MATRIX DUMP
        const tendersData = [
            { id: "T1", title: "Supply of High Efficiency Solar Irrigation Pumps", dept: "Agriculture Department, Assam", budget: 4200000, district: "Udalguri" },
            { id: "T2", title: "Construction of Composite Community Hall Complex", dept: "PWD Department", budget: 8500000, district: "Kokrajhar" },
            { id: "T3", title: "Construction of Model Anganwadi Center Facility", dept: "Social Welfare Line", budget: 2800000, district: "Goalpara" },
            { id: "T4", title: "Smart City Drainage System Integration Phase III", dept: "Guwahati Development Department", budget: 45000000, district: "Kamrup Metropolitan" },
            { id: "T5", title: "Embankment Rehabilitation & Flood Control Works", dept: "Water Resources Division", budget: 14000000, district: "Barpeta" },
            { id: "T6", title: "Rural Drinking Water Pipeline Grid Layout Setup", dept: "PHE Department", budget: 3500000, district: "Nagaon" },
            { id: "T7", title: "Procurement of Medical Lab Infrastructure Equipment", dept: "Health & Family Welfare Division", budget: 6200000, district: "Dibrugarh" }
        ];

        // System load hook up sequence
        window.addEventListener('DOMContentLoaded', () => {
            filterTenders();
        });

        // FIXED FILTER LOGIC ENGINE
        function filterTenders() {
            const selectedDistrict = document.getElementById("districtFilter").value;
            const applyHeader = document.getElementById("applyGuideHeader");
            
            // 1. Title transformation update engine
            if (applyHeader) {
                if (selectedDistrict === "ALL") {
                    applyHeader.innerText = "⚙️ How to Apply (Assam State Tenders)";
                } else {
                    applyHeader.innerText = `⚙️ How to Apply (${selectedDistrict} Regional Tenders)`;
                }
            }

            // 2. Fetching references with double checked strict layout mapping
            const smallGrid = document.getElementById("smallGrid");
            const mediumGrid = document.getElementById("mediumGrid");
            const megaGrid = document.getElementById("megaGrid");
            
            // Clearing containers cleanly
            if(smallGrid) smallGrid.innerHTML = "";
            if(mediumGrid) mediumGrid.innerHTML = "";
            if(megaGrid) megaGrid.innerHTML = "";

            let smallCount = 0, mediumCount = 0, megaCount = 0;

            // 3. Iteration array parsing pipeline
            tendersData.forEach(tender => {
                if (selectedDistrict === "ALL" || tender.district === selectedDistrict) {
                    
                    const cardHTML = `
                        <div class="tender-card">
                            <div>
                                <div class="tender-title">${tender.title}</div>
                                <div class="tender-meta">
                                    <span><strong>Dept:</strong> ${tender.dept}</span>
                                    <span><strong>ID:</strong> ${tender.id}</span>
                                </div>
                            </div>
                            <div>
                                <span class="district-tag">${tender.district}</span>
                                <div class="tender-value">${formatIndianCurrency(tender.budget)}</div>
                            </div>
                        </div>
                    `;

                    // Routing logic metrics directly to grids
                    if (tender.budget <= 5000000) {
                        if(smallGrid) { smallGrid.innerHTML += cardHTML; smallCount++; }
                    } else if (tender.budget <= 20000000) {
                        if(mediumGrid) { mediumGrid.innerHTML += cardHTML; mediumCount++; }
                    } else {
                        if(megaGrid) { megaGrid.innerHTML += cardHTML; megaCount++; }
                    }
                }
            });

            // 4. Fallback rendering context execution parameters
            const fallbackHTML = `<div class="no-data">✨ No active contracts found for this district selection layout placeholder.</div>`;
            if (smallCount === 0 && smallGrid) smallGrid.innerHTML = fallbackHTML;
            if (mediumCount === 0 && mediumGrid) mediumGrid.innerHTML = fallbackHTML;
            if (megaCount === 0 && megaGrid) megaGrid.innerHTML = fallbackHTML;
        }

        // Standard dynamic localized conversion formatting tool
        function formatIndianCurrency(num) {
            return "₹" + num.toLocaleString('en-IN');
        }
    </script>
