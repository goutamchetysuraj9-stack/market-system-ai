name: Automated Tender Scraper

on:
  schedule:
    - cron: '0 18 * * *' # Daily raat ke 11:30 baje IST par automatic chalega
  workflow_dispatch: # Isse aapko manual "Run workflow" ka button mil jayega

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Tenders Data
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add public/tenders.json || git add tenders.json
          git commit -m "Automated Data Matrix Update [Skip CI]" || echo "No changes to commit"
          git push
